    <style id="theme-vars">
/* iWantJob · Business Blue Style — 求职平台专业商务蓝 */
@import "tailwindcss";
@custom-variant dark (&:is(.dark *));

:root {
  /* ===== Brand primary scale (blue) ===== */
  --brand-50: #eff6ff;
  --brand-100: #dbeafe;
  --brand-200: #bfdbfe;
  --brand-300: #93c5fd;
  --brand-400: #60a5fa;
  --brand-500: #3b82f6;
  --brand-600: #2563eb;
  --brand-700: #1d4ed8;
  --brand-800: #1e40af;
  --brand-900: #1e3a8a;

  /* ===== Neutral scale (slate, cool gray) ===== */
  --neutral-50: #f8fafc;
  --neutral-100: #f1f5f9;
  --neutral-200: #e2e8f0;
  --neutral-300: #cbd5e1;
  --neutral-400: #94a3b8;
  --neutral-500: #64748b;
  --neutral-600: #475569;
  --neutral-700: #334155;
  --neutral-800: #1e293b;
  --neutral-900: #0f172a;

  /* ===== State colors ===== */
  --state-success: #16a34a;
  --state-warning: #d97706;
  --state-error: #dc2626;
  --state-info: #2563eb;

  /* ===== Semantic tokens ===== */
  --background: var(--neutral-50);
  --foreground: var(--neutral-900);
  --card: #ffffff;
  --card-foreground: var(--neutral-900);
  --popover: #ffffff;
  --popover-foreground: var(--neutral-900);
  --primary: var(--brand-600);
  --primary-foreground: #ffffff;
  --muted: var(--neutral-100);
  --muted-foreground: var(--neutral-500);
  --border: var(--neutral-200);
  --input: var(--neutral-200);
  --ring: var(--brand-600);

  /* Sidebar — dark navy sidebar */
  --sidebar: var(--neutral-800);
  --sidebar-foreground: var(--neutral-300);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: var(--neutral-700);
  --sidebar-accent-foreground: #ffffff;
  --sidebar-border: rgba(255,255,255,0.08);
  --sidebar-ring: var(--brand-400);

  /* Chart */
  --chart-1: var(--brand-500);
  --chart-2: var(--neutral-400);
  --chart-3: var(--brand-300);
  --chart-4: var(--neutral-500);
  --chart-5: var(--brand-700);

  /* ===== Non-color tokens ===== */
  --font-sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", ui-monospace, monospace;
  --font-serif: Georgia, ui-serif, serif;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  --spacing: 0.25rem;

  /* Shadow — static surfaces border-led, floating only deeper */
  --shadow-2xs: 0 1px 2px 0 rgba(0,0,0,0.03);
  --shadow-xs: 0 1px 2px 0 rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.05), 0 1px 2px -1px rgba(0,0,0,0.03);
  --shadow: 0 1px 3px 0 rgba(0,0,0,0.05), 0 1px 2px -1px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.04);
  --shadow-xl: 0 8px 16px -4px rgba(0,0,0,0.1);
  --shadow-2xl: 0 12px 24px -6px rgba(0,0,0,0.12);

  /* ===== Brand prefix aliases (for apply-html-head-contract.mjs) ===== */
  --iw-background: var(--background);
  --iw-foreground: var(--foreground);
  --iw-card: var(--card);
  --iw-card-foreground: var(--card-foreground);
  --iw-popover: var(--popover);
  --iw-popover-foreground: var(--popover-foreground);
  --iw-primary: var(--primary);
  --iw-primary-foreground: var(--primary-foreground);
  --iw-muted: var(--muted);
  --iw-muted-foreground: var(--muted-foreground);
  --iw-border: var(--border);
  --iw-input: var(--input);
  --iw-ring: var(--ring);
  --iw-sidebar: var(--sidebar);
  --iw-sidebar-foreground: var(--sidebar-foreground);
  --iw-sidebar-primary: var(--sidebar-primary);
  --iw-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --iw-sidebar-accent: var(--sidebar-accent);
  --iw-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --iw-sidebar-border: var(--sidebar-border);
  --iw-sidebar-ring: var(--sidebar-ring);
  --iw-radius-small: var(--radius-sm);
  --iw-radius-medium: var(--radius-md);
  --iw-radius-large: var(--radius-lg);
}

/* ===== @theme inline — Tailwind token mapping ===== */
@theme inline {
  --color-background: var(--iw-background);
  --color-foreground: var(--iw-foreground);
  --color-card: var(--iw-card);
  --color-card-foreground: var(--iw-card-foreground);
  --color-popover: var(--iw-popover);
  --color-popover-foreground: var(--iw-popover-foreground);
  --color-primary: var(--iw-primary);
  --color-primary-foreground: var(--iw-primary-foreground);
  --color-muted: var(--iw-muted);
  --color-muted-foreground: var(--iw-muted-foreground);
  --color-border: var(--iw-border);
  --color-input: var(--iw-input);
  --color-ring: var(--iw-ring);
  --color-sidebar: var(--iw-sidebar);
  --color-sidebar-foreground: var(--iw-sidebar-foreground);
  --color-sidebar-primary: var(--iw-sidebar-primary);
  --color-sidebar-primary-foreground: var(--iw-sidebar-primary-foreground);
  --color-sidebar-accent: var(--iw-sidebar-accent);
  --color-sidebar-accent-foreground: var(--iw-sidebar-accent-foreground);
  --color-sidebar-border: var(--iw-sidebar-border);
  --color-sidebar-ring: var(--iw-sidebar-ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --font-sans: var(--font-sans);
  --font-mono: var(--font-mono);
  --font-serif: var(--font-serif);
  --radius-sm: var(--iw-radius-small);
  --radius-md: var(--iw-radius-medium);
  --radius-lg: var(--iw-radius-large);
  --radius-full: var(--radius-full);
}

/* ===== Base layer ===== */
@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
}

              </div>
              <div>
                <label class="block text-sm font-medium text-[#334155] mb-1.5">月薪（K）</label>
                <div class="relative">
                  <input type="number" placeholder="如：18" value="18" class="w-full px-3 py-2 pr-10 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb]" />
                  <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-[#94a3b8]">K</span>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-[#334155] mb-1.5">年终奖（月）</label>
                <div class="relative">
                  <input type="number" placeholder="如：3" value="3" class="w-full px-3 py-2 pr-10 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb]" />
                  <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-[#94a3b8]">月</span>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-[#334155] mb-1.5">工作年限</label>
                <select class="w-full px-3 py-2 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] bg-white">
                  <option>应届</option>
                  <option selected>1-3年</option>
                  <option>3-5年</option>
                  <option>5年+</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-[#334155] mb-1.5">所在城市</label>
                <select class="w-full px-3 py-2 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] bg-white">
                  <option selected>北京</option>
                  <option>上海</option>
                  <option>深圳</option>
                  <option>杭州</option>
                  <option>广州</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-[#334155] mb-1.5">补充说明（选填）</label>
              <textarea placeholder="如：五险一金、餐补、住房补贴等福利信息..." class="w-full px-3 py-2 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb]" rows="3">六险一金，每月餐补800，免费三餐，弹性工作制。</textarea>
            </div>
            <!-- Anonymous checkbox -->
            <label class="flex items-center gap-2 mt-4 text-sm text-[#475569] cursor-pointer">
              <input type="checkbox" class="rounded border-[#e2e8f0] w-4 h-4" checked />
              匿名贡献（不显示我的用户名）
            </label>
          </div>

          <!-- Guidelines -->
          <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
            <div class="flex items-start gap-3">
              <i data-lucide="info" class="w-5 h-5 text-[#2563eb] flex-shrink-0 mt-0.5"></i>
              <div>
                <h4 class="text-sm font-semibold text-[#0f172a] mb-1">贡献须知</h4>
                <p class="text-xs text-[#475569] leading-relaxed">您的数据将匿名处理，仅用于统计分析和薪资白皮书生成。我们承诺不会将您的个人信息与薪资数据关联存储，所有数据经过脱敏处理后才能被查询和使用。</p>
              </div>
            </div>
          </div>

          <!-- Privacy note -->
          <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
            <div class="flex items-start gap-3">
              <i data-lucide="shield-check" class="w-5 h-5 text-green-600 flex-shrink-0 mt-0.5"></i>
              <div>
                <h4 class="text-sm font-semibold text-[#0f172a] mb-1">隐私保护</h4>
                <p class="text-xs text-[#475569] leading-relaxed">数据经过加密存储，不可追溯。您的真实身份与贡献数据完全隔离，确保信息安全。</p>
              </div>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="flex items-center justify-end gap-3">
            <button data-dom-id="back-salary" onclick="window.location.href='biz-salary.html'" class="border border-[#e2e8f0] text-[#475569] rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-[#f8fafc] transition-colors">
              取消
            </button>
            <button data-dom-id="submit-contribution" class="bg-[#2563eb] text-white rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-[#1d4ed8] transition-colors flex items-center gap-2">
              <i data-lucide="send" class="w-4 h-4"></i> 提交贡献
            </button>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

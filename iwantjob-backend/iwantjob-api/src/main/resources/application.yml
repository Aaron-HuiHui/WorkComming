server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: iwantjob-core-server
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/iwantjob?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true&connectTimeout=10000&socketTimeout=60000
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ===== HikariCP 高并发连接池 =====
    hikari:
      pool-name: IwantJobCoreHikari        # 池名（日志/监控可辨识）
      maximum-pool-size: 20                # 池上限：6核12线程机器，核心20 + 职位服务15 = 35 < MySQL max_connections(151)
      minimum-idle: 5                      # 常驻空闲连接，兼顾响应速度与资源占用
      connection-timeout: 8000             # 池耗尽时最多等 8s，快速失败不拖垮线程
      validation-timeout: 3000             # 连接有效性校验超时 3s
      idle-timeout: 300000                 # 超出 min-idle 的空闲连接 5 分钟后回收
      max-lifetime: 1740000               # 连接最长存活 29 分钟（必须 < MySQL wait_timeout 8h）
      keepalive-time: 60000                # 每 60s 对空闲连接保活探测，防中间设备静默断连
      leak-detection-threshold: 60000      # 连接借出 60s 未归还打告警，便于定位连接泄漏
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: iwantjob
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true          # 消费失败自动重试 3 次
          max-attempts: 3
          initial-interval: 2000
        default-requeue-rejected: false  # 重试耗尽后不重回队列，避免毒消息死循环
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100              # 流式取数批大小，避免大结果集一次性拉全量
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # SQL 日志走 logback（stdout 逐条打印是高并发吞吐瓶颈）
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT
jwt:
  secret: iwantjob-dev-secret-key-must-be-at-least-32-characters-long
  access-expiration: 7200
  refresh-expiration: 604800

# 徽章哈希盐
badge:
  salt: iwantjob-badge-salt-2026

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI 模型（OpenAI 兼容协议，阿里云百炼 MaaS）
ai:
  qwen:
    api-key: ${QWEN_API_KEY:sk-ws-H.PMLIRXD.KZ2C.MEQCIFxoadlaMmhpN8b3FkTey_VYThXjH64d3jfl1VWhEnobAiAc56eFnDbc1ren2UHVSm1OzS0V-Pf1yJWzFzjy7a6QAw}
    base-url: ${QWEN_BASE_URL:https://ws-l8nv7lrxxm2408rd.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    model: deepseek-v4-flash
    enabled: true  # true=真实模型调用；false=Mock 联调模式

# MinIO
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: iwantjob

logging:
  level:
    com.iwantjob: debug
    org.springframework.security: info

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/iwantjob?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT
jwt:
  secret: iwantjob-dev-secret-key-must-be-at-least-32-characters-long
  access-expiration: 7200
  refresh-expiration: 604800

# 徽章哈希盐
badge:
  salt: iwantjob-badge-salt-2026

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI 千问
ai:
  qwen:
    api-key: ${QWEN_API_KEY:}
    model: qwen-plus
    enabled: false  # 默认关闭，使用Mock；配置key后改为true

# MinIO
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: iwantjob

logging:
  level:
    com.iwantjob: debug
    org.springframework.security: info

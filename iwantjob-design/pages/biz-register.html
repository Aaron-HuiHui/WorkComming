    <title>注册 - 我要工作</title>
    <style id="theme-vars">
/* iWantJob · Business Blue Style — 求职平台专业商务蓝 */
@import "tailwindcss";
@custom-variant dark (&:is(.dark *));

:root {
  /* ===== Brand primary scale (blue) ===== */
  --brand-50: #eff6ff;
  --brand-100: #dbeafe;
  --brand-200: #bfdbfe;
  --brand-300: #93c5fd;
  --brand-400: #60a5fa;
  --brand-500: #3b82f6;
  --brand-600: #2563eb;
  --brand-700: #1d4ed8;
  --brand-800: #1e40af;
  --brand-900: #1e3a8a;

  /* ===== Neutral scale (slate, cool gray) ===== */
  --neutral-50: #f8fafc;
  --neutral-100: #f1f5f9;
  --neutral-200: #e2e8f0;
  --neutral-300: #cbd5e1;
  --neutral-400: #94a3b8;
  --neutral-500: #64748b;
  --neutral-600: #475569;
  --neutral-700: #334155;
  --neutral-800: #1e293b;
  --neutral-900: #0f172a;

  /* ===== State colors ===== */
  --state-success: #16a34a;
  --state-warning: #d97706;
  --state-error: #dc2626;
  --state-info: #2563eb;

  /* ===== Semantic tokens ===== */
  --background: var(--neutral-50);
  --foreground: var(--neutral-900);
  --card: #ffffff;
  --card-foreground: var(--neutral-900);
  --popover: #ffffff;
  --popover-foreground: var(--neutral-900);
  --primary: var(--brand-600);
  --primary-foreground: #ffffff;
  --muted: var(--neutral-100);
  --muted-foreground: var(--neutral-500);
  --border: var(--neutral-200);
  --input: var(--neutral-200);
  --ring: var(--brand-600);

  /* Sidebar — dark navy sidebar */
  --sidebar: var(--neutral-800);
  --sidebar-foreground: var(--neutral-300);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: var(--neutral-700);
  --sidebar-accent-foreground: #ffffff;
  --sidebar-border: rgba(255,255,255,0.08);
  --sidebar-ring: var(--brand-400);

  /* Chart */
  --chart-1: var(--brand-500);
  --chart-2: var(--neutral-400);
  --chart-3: var(--brand-300);
  --chart-4: var(--neutral-500);
  --chart-5: var(--brand-700);

  /* ===== Non-color tokens ===== */
  --font-sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", ui-monospace, monospace;
  --font-serif: Georgia, ui-serif, serif;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  --spacing: 0.25rem;

  /* Shadow — static surfaces border-led, floating only deeper */
  --shadow-2xs: 0 1px 2px 0 rgba(0,0,0,0.03);
  --shadow-xs: 0 1px 2px 0 rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.05), 0 1px 2px -1px rgba(0,0,0,0.03);
  --shadow: 0 1px 3px 0 rgba(0,0,0,0.05), 0 1px 2px -1px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.04);
  --shadow-xl: 0 8px 16px -4px rgba(0,0,0,0.1);
  --shadow-2xl: 0 12px 24px -6px rgba(0,0,0,0.12);

  /* ===== Brand prefix aliases (for apply-html-head-contract.mjs) ===== */
  --iw-background: var(--background);
  --iw-foreground: var(--foreground);
  --iw-card: var(--card);
  --iw-card-foreground: var(--card-foreground);
  --iw-popover: var(--popover);
  --iw-popover-foreground: var(--popover-foreground);
  --iw-primary: var(--primary);
  --iw-primary-foreground: var(--primary-foreground);
  --iw-muted: var(--muted);
  --iw-muted-foreground: var(--muted-foreground);
  --iw-border: var(--border);
  --iw-input: var(--input);
  --iw-ring: var(--ring);
  --iw-sidebar: var(--sidebar);
  --iw-sidebar-foreground: var(--sidebar-foreground);
  --iw-sidebar-primary: var(--sidebar-primary);
  --iw-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --iw-sidebar-accent: var(--sidebar-accent);
  --iw-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --iw-sidebar-border: var(--sidebar-border);
  --iw-sidebar-ring: var(--sidebar-ring);
  --iw-radius-small: var(--radius-sm);
  --iw-radius-medium: var(--radius-md);
  --iw-radius-large: var(--radius-lg);
}

/* ===== @theme inline — Tailwind token mapping ===== */
@theme inline {
  --color-background: var(--iw-background);
  --color-foreground: var(--iw-foreground);
  --color-card: var(--iw-card);
  --color-card-foreground: var(--iw-card-foreground);
  --color-popover: var(--iw-popover);
  --color-popover-foreground: var(--iw-popover-foreground);
  --color-primary: var(--iw-primary);
  --color-primary-foreground: var(--iw-primary-foreground);
  --color-muted: var(--iw-muted);
  --color-muted-foreground: var(--iw-muted-foreground);
  --color-border: var(--iw-border);
  --color-input: var(--iw-input);
  --color-ring: var(--iw-ring);
  --color-sidebar: var(--iw-sidebar);
  --color-sidebar-foreground: var(--iw-sidebar-foreground);
  --color-sidebar-primary: var(--iw-sidebar-primary);
  --color-sidebar-primary-foreground: var(--iw-sidebar-primary-foreground);
  --color-sidebar-accent: var(--iw-sidebar-accent);
  --color-sidebar-accent-foreground: var(--iw-sidebar-accent-foreground);
  --color-sidebar-border: var(--iw-sidebar-border);
  --color-sidebar-ring: var(--iw-sidebar-ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --font-sans: var(--font-sans);
  --font-mono: var(--font-mono);
  --font-serif: var(--font-serif);
  --radius-sm: var(--iw-radius-small);
  --radius-md: var(--iw-radius-medium);
  --radius-lg: var(--iw-radius-large);
  --radius-full: var(--radius-full);
}

/* ===== Base layer ===== */
@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="flex min-h-screen">
        <!-- Left brand panel -->
        <div class="flex w-1/2 flex-col justify-between bg-[#1e293b] p-12 relative overflow-hidden">
          <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle, #ffffff 1px, transparent 1px); background-size: 24px 24px;"></div>
          <div class="relative z-10">
            <h1 class="text-2xl font-bold text-white">💼 我要工作</h1>
          </div>
          <div class="relative z-10 flex flex-col gap-4">
            <h2 class="text-4xl font-bold text-white leading-tight">加入我们<br/>开启职业新篇章</h2>
            <p class="text-lg text-[#a3aabf] max-w-md">注册账号，即可使用AI模拟面试、浏览职位广场、贡献薪资数据，与数万求职者共同成长。</p>
            <div class="flex gap-6 mt-4">
              <div class="flex items-center gap-2 text-[#a3aabf]">
                <i data-lucide="shield-check" class="w-5 h-5 text-blue-400"></i>
                <span class="text-sm">数据加密保护</span>
              </div>
              <div class="flex items-center gap-2 text-[#a3aabf]">
                <i data-lucide="zap" class="w-5 h-5 text-blue-400"></i>
                <span class="text-sm">AI智能匹配</span>
              </div>
              <div class="flex items-center gap-2 text-[#a3aabf]">
                <i data-lucide="gift" class="w-5 h-5 text-blue-400"></i>
                <span class="text-sm">注册送50积分</span>
              </div>
            </div>
          </div>
          <div class="relative z-10 flex gap-2">
            <div class="w-2 h-2 rounded-full bg-blue-400"></div>
            <div class="w-2 h-2 rounded-full bg-blue-400/60"></div>
            <div class="w-2 h-2 rounded-full bg-blue-400/30"></div>
          </div>
        </div>

        <!-- Right form panel -->
        <div class="flex w-1/2 items-center justify-center bg-[#f8fafc] p-8">
          <div class="w-96">
            <div class="bg-white rounded-lg shadow-lg p-8 border border-[#e2e8f0]">
              <h2 class="text-2xl font-bold text-[#0f172a] mb-1">注册</h2>
              <p class="text-sm text-[#64748b] mb-6">创建你的账号，开始求职之旅</p>

              <!-- Username -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-[#334155] mb-1.5">用户名</label>
                <div class="relative">
                  <i data-lucide="user" class="w-4 h-4 text-[#94a3b8] absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input type="text" placeholder="请输入用户名" class="w-full pl-10 pr-3 py-2.5 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb]" value="zhangsan" />
                </div>
              </div>

              <!-- Email -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-[#334155] mb-1.5">邮箱地址</label>
                <div class="relative">
                  <i data-lucide="mail" class="w-4 h-4 text-[#94a3b8] absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input type="email" placeholder="请输入邮箱地址" class="w-full pl-10 pr-3 py-2.5 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb]" value="zhangsan@example.com" />
                </div>
              </div>

              <!-- Password -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-[#334155] mb-1.5">密码</label>
                <div class="relative">
                  <i data-lucide="lock" class="w-4 h-4 text-[#94a3b8] absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input type="password" placeholder="请输入密码" class="w-full pl-10 pr-3 py-2.5 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb]" value="••••••••" />
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-[#334155] mb-1.5">确认密码</label>
                <div class="relative">
                  <i data-lucide="lock-keyhole" class="w-4 h-4 text-[#94a3b8] absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input type="password" placeholder="请再次输入密码" class="w-full pl-10 pr-3 py-2.5 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb]" value="••••••••" />
                </div>
              </div>

              <!-- Role select -->
              <div class="mb-6">
                <label class="block text-sm font-medium text-[#334155] mb-1.5">身份类型</label>
                <div class="relative">
                  <i data-lucide="user-cog" class="w-4 h-4 text-[#94a3b8] absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <select class="w-full pl-10 pr-8 py-2.5 border border-[#e2e8f0] rounded text-sm focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb] appearance-none bg-white">
                    <option value="seeker" selected>求职者</option>
                    <option value="hr">HR（招聘方）</option>
                  </select>
                  <i data-lucide="chevron-down" class="w-4 h-4 text-[#94a3b8] absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
              </div>

              <!-- Agreement -->
              <label class="flex items-start gap-2 text-sm text-[#64748b] mb-6 cursor-pointer">
                <input type="checkbox" class="rounded border-[#e2e8f0] mt-0.5" checked />
                <span>我已阅读并同意 <a href="#" class="text-[#2563eb] hover:underline">《用户协议》</a> 和 <a href="#" class="text-[#2563eb] hover:underline">《隐私政策》</a></span>
              </label>
